version: '3.8'

services:
  # Lightweight LLM Container (Ollama)
  tiny-llm:
    image: ollama/ollama:latest
    container_name: tiny-llm-service
    ports:
      - "11434:11434"
    volumes:
      - llm_models:/root/.ollama/models
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=5m
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - llm-network

  # API Gateway (Optional: FastAPI wrapper for easier integration)
  llm-api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: llm-api-gateway
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_HOST=http://tiny-llm:11434
      - API_PORT=5000
      - LOG_LEVEL=info
    depends_on:
      tiny-llm:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - llm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  llm_models:
    driver: local

networks:
  llm-network:
    driver: bridge
