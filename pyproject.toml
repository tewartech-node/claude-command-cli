[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warnetech"
version = "0.1.0"
description = "Warnetech system (server, control-plane, AI controller, connectors)"
requires-python = ">=3.10"
dependencies = [
    # Required: SecurityManager and aes_gcm_encrypt/decrypt raise RuntimeError without it.
    "cryptography>=42.0",
]

[project.optional-dependencies]
# Guarded imports with availability flags — the code degrades rather than crashes.
compression = ["lz4>=4.3", "zstandard>=0.22"]
parquet = ["pyarrow>=15.0"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools]
packages = [
    "warnetech_envelope",
    "warnetech_operator",
    "warnetech_server",
    "warnetech_control_plane",
    "warnetech_ai_controller",
    "warnetech_connectors",
    "warnetech_cli",
    "warnetech_curriculum",
    "supabase_schema"
]

[project.scripts]
# The canonical CLI. Previously reachable only via `python -m
# warnetech_cli.main` -- it had no console script of its own.
warnetech = "warnetech_cli.main:main"
# Parameter-free preflight + failure ledger. Stdlib only, so this works on a
# Termux install with no network and no build toolchain.
warnetech-curriculum = "warnetech_curriculum.cli:main"
# Local backup/recall, plus an optional client-side-encrypted S3 offsite
# tier (see the `s3` extra and docs/11_BACKUP_AND_RECOVERY.md).
warnetech-backup-recall = "warnetech_operator.warnetech_backup_recall:main"
# Environment self-check: is this machine set up to run the CLI at all.
# Stdlib only, run this first on a fresh Termux install.
warnetech-doctor = "warnetech_cli.doctor:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
