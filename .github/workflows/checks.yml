# The checks that keep the three layers honest.
#
# Until this file existed, nothing ran the test suites automatically: the only
# workflow in the repository was an unmodified SLSA template that built two
# placeholder files. That gap is recorded in the curriculum ledger as
# WL-OPEN-004, because a rule nobody runs protects nothing.
#
# The curriculum is applied as a ratchet, deliberately:
#
#   * `preflight --since` judges a pull request on the files it actually
#     changes, and blocks. New work is held to the full curriculum.
#   * `check` scans the whole tree for the record, and does not block. The
#     pre-existing findings it reports are tracked in the ledger rather than
#     stopping unrelated work.
#
# That way the debt is visible without being a tax on every contributor, and
# it cannot grow.

name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # preflight --since needs the base branch present

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

      - name: Curriculum -- changed files must be clean (blocking)
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            warnetech-curriculum preflight --since "$base" --no-record
          else
            echo "no base revision to diff against; skipping the scoped gate"
          fi

      - name: Curriculum -- whole-tree debt report (informational)
        if: always()
        run: warnetech-curriculum check --no-record || true

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm install

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check
        continue-on-error: true # 8 files are unformatted today; tracked, not blocking

      - name: Tests (jest)
        run: npm test
